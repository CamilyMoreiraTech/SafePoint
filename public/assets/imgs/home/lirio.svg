<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 380">
  <defs>
    <linearGradient id="cor-petala" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3b1d8f"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff7ae6"/>
    </linearGradient>
    <linearGradient id="cor-folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1366"/>
      <stop offset="1" stop-color="#6d4bc4"/>
    </linearGradient>
    <g id="petala">
      <path d="M0 0 C -34 -30 -40 -90 -4 -132 C 24 -96 30 -40 0 0 Z" fill="url(#cor-petala)" stroke="#c4a7ff" stroke-width="1.5"/>
      <path d="M0 -6 C -6 -45 -8 -90 -4 -126" fill="none" stroke="#ffb8f0" stroke-width="1" opacity="0.7"/>
    </g>
    <path id="brilho" d="M0 -12 L2.5 -2.5 L12 0 L2.5 2.5 L0 12 L-2.5 2.5 L-12 0 L-2.5 -2.5 Z" fill="#ffc2f2"/>
  </defs>

  <!-- caule e folhas -->
  <path d="M170 170 C 160 240 175 310 160 380" fill="none" stroke="#6d4bc4" stroke-width="4"/>
  <path d="M165 250 C 200 215 250 215 290 190 C 260 240 210 262 165 262 Z" fill="url(#cor-folha)" stroke="#8b5cf6" stroke-width="1.5"/>
  <path d="M168 300 C 130 270 80 275 40 255 C 70 300 120 312 168 312 Z" fill="url(#cor-folha)" stroke="#8b5cf6" stroke-width="1.5"/>

  <!-- pétalas de trás -->
  <g opacity="0.6">
    <use xlink:href="#petala" transform="translate(170 165) rotate(-150)"/>
    <use xlink:href="#petala" transform="translate(170 165) rotate(140)"/>
  </g>

  <!-- pétalas da frente -->
  <use xlink:href="#petala" transform="translate(170 165) rotate(-100)"/>
  <use xlink:href="#petala" transform="translate(170 165) rotate(80)"/>
  <use xlink:href="#petala" transform="translate(170 165) rotate(-55)"/>
  <use xlink:href="#petala" transform="translate(170 165) rotate(35)"/>
  <use xlink:href="#petala" transform="translate(170 165) rotate(-10)"/>

  <!-- miolo -->
  <g transform="translate(170 165)" stroke="#ffd6f7" stroke-width="1.5" fill="#ff7ae6">
    <line x1="0" y1="0" x2="-20" y2="-70"/>
    <line x1="0" y1="0" x2="5" y2="-78"/>
    <line x1="0" y1="0" x2="28" y2="-66"/>
    <line x1="0" y1="0" x2="45" y2="-50"/>
    <circle cx="-20" cy="-70" r="3.5" stroke="none"/>
    <circle cx="5" cy="-78" r="3.5" stroke="none"/>
    <circle cx="28" cy="-66" r="3.5" stroke="none"/>
    <circle cx="45" cy="-50" r="3.5" stroke="none"/>
    <circle cx="0" cy="0" r="6" stroke="none"/>
  </g>

  <!-- brilhos e pontinhos -->
  <use xlink:href="#brilho" transform="translate(60 60)"/>
  <use xlink:href="#brilho" transform="translate(285 80) scale(0.7)"/>
  <use xlink:href="#brilho" transform="translate(255 305) scale(0.6)"/>
  <use xlink:href="#brilho" transform="translate(80 185) scale(0.5)"/>
  <g fill="#ff9ae8">
    <circle cx="240" cy="40" r="2.5"/>
    <circle cx="258" cy="58" r="1.5"/>
    <circle cx="226" cy="22" r="2"/>
    <circle cx="272" cy="30" r="1.5" opacity="0.7"/>
    <circle cx="250" cy="110" r="2"/>
    <circle cx="290" cy="130" r="1.5" opacity="0.7"/>
    <circle cx="210" cy="60" r="1.5"/>
    <circle cx="300" cy="50" r="2" opacity="0.6"/>
    <circle cx="110" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="40" cy="130" r="2" opacity="0.6"/>
    <circle cx="70" cy="230" r="1.5"/>
    <circle cx="280" cy="250" r="2" opacity="0.7"/>
  </g>
</svg>
